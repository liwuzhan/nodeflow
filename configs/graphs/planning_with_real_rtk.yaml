# NodeFlow 规划闭环 - 真实RTK版本（真机作业）
#
# 完整的真机自动作业流程：
#   - 使用 parcel_planner 提供地块信息（本地JSON配置）
#   - 使用真实 RTK 驱动节点进行定位
#   - 使用 pwm_driver 控制真实电机
#   - 完整的真实RTK → 滤波 → 坐标转换 → 规划 → 导航 → 控制流程

graph_id: planning_real_rtk
graph_version: 1.0
node_hub_path: ./node-hub

# ═══════════════════════════════════════════════════════════════════════════
# 节点定义
# ═══════════════════════════════════════════════════════════════════════════

nodes:
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 地块规划器 - 提供地块信息                                             │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: parcel_planner
    package: parcel_planner
    description: "读取本地地块配置，提供地块边界和车辆参数"
    params:
      parcel_name: "default"            # 地块名称（对应 data/parcels/default.json）
      send_interval: 1.0                # 发送间隔（秒）

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 真实RTK驱动节点                                                       │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: rtk_sensor
    package: rtk_driver
    description: "真实高精度RTK-GPS传感器驱动"
    params:
      # 串口配置
      serial_port: "/dev/ttyACM3"       # UM982 RTK
      serial_baudrate: 115200
      serial_timeout: 1.0
      use_network: false

      # NMEA消息配置
      nmea_message: "GPRMC"              # 设备输出 GNRMC+GNGGA+GNTHS
      output_frequency: 20              # 20Hz匹配导航系统

      # RTK质量控制
      min_rtk_quality: 3                # 3=FIXED（最高），4会过滤掉所有数据
      min_satellites: 10

      # 数据处理
      enable_smoothing: false
      heading_source: "device"

      # 调试
      enable_raw_log: true
      raw_log_path: "/tmp/rtk_raw.log"

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 全局路径规划                                                         │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: global_coverage
    package: global_coverage
    description: "根据地块和车辆配置生成全覆盖路径"
    params:
      planning_strategy: contour_spiral
      path_point_spacing: 0.5
      turn_angle_threshold_deg: 45.0
      turn_zone_radius_m: 4.0
      work_speed_limit_mps: 1.2
      turn_speed_limit_mps: 0.5

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ RTK滤波器                                                            │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: rtk_filter
    package: rtk_filter
    description: "RTK滤波/融合"
    params:
      alpha_pos: 0.2
      alpha_heading: 0.3
      use_imu_yaw_rate: false

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 坐标系转换 (WGS84 → ENU)                                            │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: coord_transform
    package: coord_transform
    description: "将WGS84坐标转换为ENU局部坐标系"
    params: {}

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 前瞻点选择器                                                         │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: waypoint_selector
    package: waypoint_selector
    description: "基于视野区域的前瞻点选择器"
    params:
      view_distance: 2.0
      view_width: 4.0
      view_depth: 1.5
      goal_tolerance: 1.5
      max_search_points: 100
      initial_check_points: 10
      initial_consume_distance: 2.0
      min_view_points: 3
      view_expand_factor: 2.0
      max_view_width: 12.0
      continuous_consume_distance: 1.5
      progress_sync_max_cross_track_m: 12.0
      progress_target_enabled: true
      progress_target_lookahead_m: 2.5
      progress_target_turn_lookahead_m: 1.5
      progress_target_max_cross_track_m: 12.0

  - id: path_progress
    package: path_progress
    description: "将实时位姿投影到 operation_plan，输出当前段和误差"
    params:
      search_window: 120
      heading_match_weight_m: 2.0
      publish_interval: 0.02

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 轨迹控制器                                                           │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: track_controller
    package: track_controller
    description: "履带控制，支持原地转向"
    params:
      max_speed: 2.0
      min_speed: 0.0
      heading_p_gain: 2.0
      max_angular_velocity: 1.0
      pivot_threshold_deg: 20.0
      decel_start_distance: 3.0
      final_stop_distance: 0.5

  - id: tillage_controller
    package: tillage_controller
    description: "旋耕机具 PTO 与悬挂状态机"
    params:
      hitch_lower_time_s: 1.5
      hitch_raise_time_s: 1.5
      headland_width_m: 3.0
      pto_engage_delay_s: 0.5
      auto_zone_detect: true
      hitch_working_height: 1.0
      enable_verbose_log: false

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ PWM驱动节点 - 真机电机控制                                            │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: pwm_driver
    package: pwm_driver
    description: "将速度命令转换为电机PWM信号"
    params:
      # PWM基础配置
      pwm_frequency: 50.0
      left_pwmchip: pwmchip0
      left_pwm_channel: 0
      right_pwmchip: pwmchip4
      right_pwm_channel: 0

      # PWM脉宽范围（纳秒）
      pwm_min_ns: 1000000
      pwm_center_ns: 1500000
      pwm_max_ns: 2000000
      pwm_duty_scale: 1.0               # 全行程

      # 车辆参数
      wheel_base: 0.5                   # 轮距（米）
      max_linear_speed: 2.0
      max_angular_speed: 4.0            # 2 × max_linear / wheel_base（按1.0算）

      # 安全配置
      enable_safety_check: true
      command_timeout: 0.5
      dry_run_mode: true                # ⚠️ 首次测试设为true，不实际输出PWM

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 轨迹可视化                                                           │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: trajectory_viz
    package: trajectory_viz
    description: "生成轨迹对比可视化图像"
    params:
      output_dir: "/tmp/rtk_trajectory"
      image_format: "png"
      timeout: 0.0
      update_interval: 10.0
      dpi: 150
      figsize_width: 14.0
      figsize_height: 12.0

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 日志记录与Web实时可视化（暂时禁用）                                   │
  # └─────────────────────────────────────────────────────────────────────┘
  # - id: logger
  #   package: logger
  #   description: "记录关键数据并提供Web实时展示"
  #   params:
  #     web_port: 8001              # Web界面端口
  #     buffer_size: 1000           # 内存缓冲区大小
  #     enable_file_log: true       # 启用文件日志
  #     log_file_path: /tmp/nodeflow_data.jsonl

# ═══════════════════════════════════════════════════════════════════════════
# 数据连接 (边)
# ═══════════════════════════════════════════════════════════════════════════

edges:
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 地块规划流程                                                          │
  # └─────────────────────────────────────────────────────────────────────┘

  # 地块规划器 → 坐标转换网关（设置参考点）
  - from: parcel_planner.task_enu
    to: coord_transform.task_enu
    description: "地块信息和GPS参考点"

  # 坐标转换网关 → 路径规划器
  - from: coord_transform.task_enu
    to: global_coverage.task_enu
    description: "地块和车辆配置（ENU坐标）"

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 真实RTK定位流                                                         │
  # └─────────────────────────────────────────────────────────────────────┘

  # 真实RTK → RTK滤波
  - from: rtk_sensor.rtk_fix
    to: rtk_filter.rtk_fix
    description: "真实RTK数据 → 滤波"

  # RTK滤波 → 坐标转换 (WGS84 → ENU)
  - from: rtk_filter.filtered_rtk
    to: coord_transform.rtk_fix
    description: "滤波后的RTK → ENU坐标转换"

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 导航控制流程 (全部使用ENU坐标)                                        │
  # └─────────────────────────────────────────────────────────────────────┘

  # 规划路径 → 前瞻点选择
  - from: global_coverage.global_path
    to: waypoint_selector.global_path
    description: "规划路径 (ENU坐标)"

  - from: global_coverage.operation_plan
    to: waypoint_selector.operation_plan
    description: "作业计划与路径版本"

  - from: global_coverage.operation_plan
    to: path_progress.operation_plan
    description: "作业计划 → 路径进度"

  - from: coord_transform.pose_enu
    to: waypoint_selector.pose_enu
    description: "ENU姿态 → 前瞻点选择"

  - from: coord_transform.pose_enu
    to: path_progress.pose_enu
    description: "ENU姿态 → 路径进度"

  - from: path_progress.progress_state
    to: waypoint_selector.path_progress
    description: "路径进度 → 前瞻点同步"

  # 前瞻点 + ENU姿态 → 轨迹控制
  - from: waypoint_selector.next_point
    to: track_controller.next_point
    description: "前瞻点 (ENU)"

  - from: coord_transform.pose_enu
    to: track_controller.pose_enu
    description: "ENU姿态 → 轨迹控制"

  - from: path_progress.progress_state
    to: track_controller.path_progress
    description: "路径进度 → 段限速和误差保护"

  - from: coord_transform.pose_enu
    to: tillage_controller.pose_enu
    description: "ENU姿态 → 机具控制"

  - from: waypoint_selector.next_point
    to: tillage_controller.next_point
    description: "终点与 zone → 机具控制"

  - from: coord_transform.task_enu
    to: tillage_controller.task_enu
    description: "地块边界 → 机具控制"

  - from: path_progress.progress_state
    to: tillage_controller.path_progress
    description: "作业段语义 → 机具控制"

  # 速度指令 → PWM驱动（真机电机）
  - from: track_controller.velocity_cmd
    to: pwm_driver.velocity_cmd
    description: "线速度和角速度 → 电机PWM"

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 可视化数据流
  # └─────────────────────────────────────────────────────────────────────┘

  # 地块信息 → 可视化
  - from: coord_transform.task_enu
    to: trajectory_viz.task_enu
    description: "地块边界信息 (ENU坐标)"

  # 规划路径 → 可视化
  - from: global_coverage.global_path
    to: trajectory_viz.global_path
    description: "规划的全局路径 (ENU坐标)"

  - from: global_coverage.operation_plan
    to: trajectory_viz.operation_plan
    description: "作业计划 → 可视化"

  # ENU姿态 → 可视化
  - from: coord_transform.pose_enu
    to: trajectory_viz.pose_enu
    description: "实际轨迹 (ENU坐标)"

  - from: path_progress.progress_state
    to: trajectory_viz.path_progress
    description: "路径进度 → 可视化"

  - from: waypoint_selector.next_point
    to: trajectory_viz.next_point
    description: "前瞻点 → 可视化"

  - from: track_controller.velocity_cmd
    to: trajectory_viz.velocity_cmd
    description: "速度指令 → 可视化"

  - from: tillage_controller.tillage_cmd
    to: trajectory_viz.tillage_cmd
    description: "机具命令 → 可视化"

  - from: tillage_controller.tillage_status
    to: trajectory_viz.tillage_status
    description: "机具状态 → 可视化"

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 监测和日志数据流（暂时禁用）
  # └─────────────────────────────────────────────────────────────────────┘

  # # 真实RTK数据 → logger (实时位置监测)
  # - from: rtk_sensor.rtk_fix
  #   to: logger.input1
  #   description: "真实RTK GPS定位数据"

  # # 规划路径 → logger (路径调试)
  # - from: global_coverage.global_path
  #   to: logger.input2
  #   description: "全局规划路径"

  # # 速度指令 → logger (控制分析)
  # - from: track_controller.velocity_cmd
  #   to: logger.input3
  #   description: "速度控制指令"

# ═══════════════════════════════════════════════════════════════════════════
# 使用说明
# ═══════════════════════════════════════════════════════════════════════════

# 启动前准备：
#
# 1. 配置地块文件
#    编辑 node-hub/parcel_planner/data/parcels/default.json
#    设置地块边界 GPS 坐标和参考点
#
# 2. 连接RTK设备到USB
#    检查串口: ls /dev/ttyUSB* /dev/ttyACM*
#
# 3. 停止ModemManager（避免占用串口）
#    sudo systemctl stop ModemManager
#
# 启动步骤：
#
# 1. 首次测试：确认 pwm_driver.dry_run_mode: true（不实际输出PWM）
#    python3 -m runtime.main examples/planning_with_real_rtk.yaml
#
# 2. 确认工作正常后：
#    修改 dry_run_mode: false
#    降低速度：max_speed: 0.5, pwm_duty_scale: 0.3
#
# 3. 查看轨迹可视化
#    打开 /tmp/rtk_trajectory/trajectory_latest.png
#
# 4. 查看RTK原始日志
#    tail -f /tmp/rtk_raw.log

# 数据流：
#
#   [parcel_planner] → task_enu → [coord_transform] → task_enu → [global_coverage]
#                                        ↑                              ↓
#   [rtk_sensor] → [rtk_filter] → rtk_fix/filtered_rtk            global_path
#                                        ↓                              ↓
#                                    pose_enu → [waypoint_selector] ← global_path
#                                        ↓              ↓
#                                    pose_enu → [track_controller] ← next_point
#                                                       ↓
#                                               velocity_cmd → [pwm_driver]

# 关键特点：
#   ✅ 使用 parcel_planner 读取本地地块配置（无需仿真器）
#   ✅ 使用真实 RTK 设备进行高精度定位
#   ✅ 使用 pwm_driver 控制真实电机
#   ✅ 完整的自动化作业流程
