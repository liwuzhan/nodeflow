name: mock_path_planner
version: "1.0"
description: "Mock path planner that generates navigation paths from target waypoints"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  darwin:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs:
    - name: target
      type: json
      description: "Target waypoint request (latitude, longitude)"
  outputs:
    - name: path
      type: json
      description: "Generated navigation path as a sequence of waypoints"

params:
  plan_mode:
    type: string
    default: "direct_line"
    description: "Planning algorithm: 'direct_line', 'grid_search', 'astar'"

  path_length:
    type: number
    default: 10
    description: "Number of waypoints in the path"

  spacing_meters:
    type: number
    default: 5.0
    description: "Distance between waypoints (meters)"

  computation_delay_ms:
    type: number
    default: 50
    description: "Simulated computation delay (milliseconds)"
