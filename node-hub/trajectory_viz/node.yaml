name: trajectory_viz
version: "2.1.0"
description: "轨迹实时可视化节点 - Web 版本（按L3/L4规范重构）"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  darwin:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs:
    - name: task_enu
      type: planning.task_enu
      description: "规划任务请求（ENU坐标），包含地块边界和GPS参考点"
    - name: global_path
      type: planning.path
      description: "规划器输出的全局路径（ENU坐标）"
    - name: pose_enu
      type: localization.pose_enu
      description: "ENU坐标系姿态，用于记录实际轨迹 (x, y, theta)"
  outputs:
    - name: web_url
      type: json
      description: "Web 可视化界面的 URL 和统计信息"

params:
  web_host:
    type: string
    default: "127.0.0.1"
    description: "Web 服务器监听地址（127.0.0.1 仅本机，0.0.0.0 所有网络）"

  web_port:
    type: integer
    default: 8080
    description: "Web 服务器端口号（建议使用 >1024 的端口避免权限问题）"

  timeout:
    type: float
    default: 300.0
    description: "节点运行超时时间 (秒)"

  update_interval:
    type: float
    default: 5.0
    description: "日志打印间隔（秒）。数据推送是近实时的（0.5秒防抖），此参数仅控制日志频率"
