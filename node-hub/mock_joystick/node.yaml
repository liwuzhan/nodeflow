name: mock_joystick
version: "1.0"
description: "Mock joystick/hand controller simulator for testing control input flow"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  darwin:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs: []
  outputs:
    - name: control_input
      type: json
      description: "Simulated control commands with linear/angular velocity"

params:
  mode:
    type: string
    default: "sine"
    description: "Control value generation mode: 'constant', 'sine', 'random'"

  update_rate_hz:
    type: number
    default: 50
    description: "Publishing frequency in Hz"

  max_linear_velocity:
    type: number
    default: 2.0
    description: "Maximum linear velocity (m/s)"

  max_angular_velocity:
    type: number
    default: 1.57
    description: "Maximum angular velocity (rad/s)"
