name: arc_tracker
version: 1.0.0
description: 弧线跟踪控制器 - 贝塞尔路径 + Pure Pursuit 弧线跟踪

metadata:
  coordinate_system: ENU
  heading_convention: mathematical  # 东=0, CCW正, 弧度

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  darwin:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs:
    - name: bezier_path
      type: planning.bezier_path
      description: |
        贝塞尔平滑路径（ENU坐标）
        - segments: 贝塞尔段列表，每段4个控制点 {p0,p1,p2,p3}
        - total_length: 估算总弧长（米）
    - name: pose_enu
      type: localization.pose_enu
      description: |
        ENU坐标系位姿
        - x, y: 位置（米）
        - theta: 航向角（弧度，数学坐标系）

  outputs:
    - name: velocity_cmd
      type: control.velocity
      description: |
        速度控制指令
        - linear_velocity: 线速度 (m/s)
        - angular_velocity: 角速度 (rad/s, 正=左转)

params:
  cruise_speed:
    type: float
    default: 1.0
    description: "巡航速度 (m/s)"

  min_speed:
    type: float
    default: 0.05
    description: "最小速度 (m/s)，防止完全停滞"

  lookahead_base:
    type: float
    default: 1.0
    description: "基础前瞻距离 (m)"

  lookahead_k:
    type: float
    default: 0.5
    description: "前瞻距离随速度增长系数: L_d = base + k * v"

  max_angular_velocity:
    type: float
    default: 1.5
    description: "最大角速度 (rad/s)"

  pivot_threshold_deg:
    type: float
    default: 60.0
    description: "原地转向阈值（度），航向偏差大于此值时原地转"

  curvature_decel_factor:
    type: float
    default: 1.0
    description: "曲率减速系数，越大���道减速越多"

  decel_distance:
    type: float
    default: 2.0
    description: "终点减速距离 (m)，到终点小于此距离时开始减速"

  stop_distance:
    type: float
    default: 0.3
    description: "停车距离 (m)，到终点小于此距离时停车"
