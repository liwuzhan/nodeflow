name: sim_velocity
version: "1.0"
description: "仿真速度控制节点 - 接收速度命令(v,ω)并发送给仿真器执行"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs:
    - name: velocity_cmd
      type: json
      description: "速度控制命令 (linear_velocity, angular_velocity)"
  outputs: []

params:
  simulator_host:
    type: string
    default: "localhost"
    description: "仿真器服务器地址"

  simulator_port:
    type: integer
    default: 5555
    description: "仿真器服务器端口"

  timeout:
    type: integer
    default: 1000
    description: "ZMQ 请求超时 (毫秒)"

  default_linear_velocity:
    type: float
    default: 0.0
    description: "默认线速度 (m/s)"

  default_angular_velocity:
    type: float
    default: 0.0
    description: "默认角速度 (rad/s)"

  control_frequency:
    type: integer
    default: 50
    description: "控制循环频率 (Hz)"

  max_linear_velocity:
    type: float
    default: 2.0
    description: "最大线速度限制 (m/s)"

  max_angular_velocity:
    type: float
    default: 1.0
    description: "最大角速度限制 (rad/s)"
