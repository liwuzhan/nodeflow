name: mock_data_validator
version: "1.0"
description: "Data validator that checks data quality and integrity"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  darwin:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs:
    - name: data_in
      type: json
      description: "Input data to validate"
  outputs: []

params:
  min_frequency_hz:
    type: number
    default: 5
    description: "Minimum expected data frequency (Hz)"

  check_seq_continuity:
    type: bool
    default: true
    description: "Check if seq numbers are continuous"

  report_interval_sec:
    type: number
    default: 10
    description: "Report interval (seconds)"
