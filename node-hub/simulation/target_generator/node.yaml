name: target_generator
version: 0.1.0
description: Generates random target points for testing

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs:
    - name: gps_fix
      type: gps.fix
      description: Current position
  outputs:
    - name: target_point
      type: planning.target
      description: Target latitude/longitude

params:
  update_distance_threshold:
    type: float
    default: 10.0
  target_distance:
    type: float
    default: 50.0
