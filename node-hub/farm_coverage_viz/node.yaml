name: farm_coverage_viz
version: "1.0"
description: "农田覆盖区域可视化节点 - 读取RTK数据生成实时覆盖图"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]

ports:
  inputs:
    - name: rtk_fix
      type: json
      description: "RTK GPS位置数据 (高精度)"
    - name: spray_status
      type: json
      description: "喷洒系统状态 (是否正在喷洒)"
  outputs:
    - name: coverage_stats
      type: json
      description: "覆盖统计信息"
    - name: coverage_map_url
      type: string
      description: "覆盖图URL地址"

params:
  field_width:
    type: float
    default: 100.0
    description: "田地宽度 (米)"

  field_length:
    type: float
    default: 200.0
    description: "田地长度 (米)"

  swath_width:
    type: float
    default: 12.0
    description: "喷洒带宽 (米)"

  resolution:
    type: float
    default: 0.1
    description: "网格分辨率 (米)"

  output_dir:
    type: string
    default: "./coverage_maps"
    description: "覆盖图输出目录"

  update_interval:
    type: float
    default: 2.0
    description: "可视化更新间隔 (秒)"

  web_port:
    type: integer
    default: 8080
    description: "Web界面端口"