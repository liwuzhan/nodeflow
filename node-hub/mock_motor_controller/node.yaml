name: mock_motor_controller
version: "1.0"
description: "Mock motor controller that simulates receiving and executing control commands"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  darwin:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs:
    - name: control_cmd
      type: json
      description: "Control commands (velocity and steering angle)"
  outputs: []

params:
  motor_count:
    type: number
    default: 2
    description: "Number of motors to simulate"

  response_delay_ms:
    type: number
    default: 100
    description: "Motor response delay (milliseconds)"

  max_pwm:
    type: number
    default: 1500
    description: "Maximum PWM value"
