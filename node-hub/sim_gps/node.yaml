name: sim_gps
version: "1.0"
description: "仿真 GPS 节点 - 从仿真器读取位置数据"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]

ports:
  inputs: []
  outputs:
    - name: gps_fix
      type: json
      description: "GPS 位置数据 (lat, lon, alt, hdop)"

params:
  simulator_host:
    type: string
    default: "localhost"
    description: "仿真器服务器地址"

  simulator_port:
    type: integer
    default: 5555
    description: "仿真器服务器端口"

  frequency:
    type: integer
    default: 10
    description: "数据发布频率 (Hz)"

  timeout:
    type: integer
    default: 1000
    description: "ZMQ 请求超时 (毫秒)"
