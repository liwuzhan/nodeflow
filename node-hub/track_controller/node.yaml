name: track_controller
version: "1.0"
description: "轨迹跟踪控制器，支持履带底盘原地转向"

metadata:
  coordinate_system: ENU          # 局部坐标系: ENU (East-North-Up)
  heading_convention: mathematical # 航向角约定: 东=0°, CCW正, (-π,π]

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]
ports:
  inputs:
    - name: pose_enu
      type: localization.pose_enu
      description: |
        ENU坐标系姿态
        - x: 东向位置（米）
        - y: 北向位置（米）
        - theta: 航向角（弧度），数学坐标系，东=0，CCW正
    - name: next_point
      type: planning.waypoint
      description: |
        前瞻目标点
        - x/y: ENU坐标（米）
        - final: 是否为终点
  outputs:
    - name: velocity_cmd
      type: control.velocity
      description: |
        速度控制命令
        - linear_velocity: 线速度（m/s），正=前进
        - angular_velocity: 角速度（rad/s），正=CCW（逆时针）
params:
  max_speed:
    type: float
    default: 1.0
  min_speed:
    type: float
    default: 0.0
  heading_p_gain:
    type: float
    default: 2.5
  max_angular_velocity:
    type: float
    default: 1.0
  pivot_threshold_deg:
    type: float
    default: 15.0
  decel_start_distance:
    type: float
    default: 2.0
    description: "开始减速的距离阈值 (米)"
  final_stop_distance:
    type: float
    default: 0.5
    description: "终点停止距离阈值 (米)"
