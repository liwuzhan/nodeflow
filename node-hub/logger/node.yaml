name: logger
version: 0.1.0
description: 日志记录节点 - 接收多输入并提供实时Web展示

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  darwin:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs:
    - name: input1
      type: any
      description: 第一个输入端口
    - name: input2
      type: any
      description: 第二个输入端口
    - name: input3
      type: any
      description: 第三个输入端口
  outputs: []

params:
  web_port:
    type: int
    default: 8001
    description: Web服务端口号
  buffer_size:
    type: int
    default: 1000
    description: 内存缓冲区大小（条数）
  enable_file_log:
    type: bool
    default: false
    description: 是否启用文件日志输出
  log_file_path:
    type: string
    default: "./logs/logger.jsonl"
    description: 日志文件路径
