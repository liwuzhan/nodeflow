name: mock_data_generator
version: "1.0"
description: "Generic data generator with error injection for testing"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  darwin:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs: []
  outputs:
    - name: data_out
      type: json
      description: "Generated test data with optional errors"

params:
  data_type:
    type: string
    default: "generic_json"
    description: "Data type: 'gps', 'imu', 'control', 'generic_json'"

  rate_hz:
    type: number
    default: 10
    description: "Publishing frequency (Hz)"

  error_injection:
    type: string
    default: "none"
    description: "Error mode: 'none', 'dropout', 'noise', 'corruption'"

  error_rate:
    type: number
    default: 0.01
    description: "Error rate (0.0-1.0, e.g., 0.01 = 1%)"
