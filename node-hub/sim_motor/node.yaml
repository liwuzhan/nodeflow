name: sim_motor
version: "1.0"
description: "仿真电机控制节点 - 接收控制指令并发送给仿真器"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]

ports:
  inputs:
    - name: motor_cmd
      type: json
      description: "电机控制指令 (throttle, steering)"
  outputs: []

params:
  simulator_host:
    type: string
    default: "localhost"
    description: "仿真器服务器地址"

  simulator_port:
    type: integer
    default: 5555
    description: "仿真器服务器端口"

  timeout:
    type: integer
    default: 1000
    description: "ZMQ 请求超时 (毫秒)"

  default_throttle:
    type: float
    default: 0.0
    description: "默认油门值（无指令时）"

  default_steering:
    type: float
    default: 0.0
    description: "默认转向值（无指令时）"
