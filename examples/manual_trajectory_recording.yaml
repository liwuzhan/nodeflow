# NodeFlow 手动轨迹记录场景
#
# 这个示例演示使用RTK定位设备 + Web遥控进行手动轨迹记录：
#
# 功能说明：
#   - 使用高精度RTK GPS获取实时定位数据
#   - 提供Web遥控界面控制车辆移动
#   - 提供Web界面进行手动/自动点位记录
#   - 自动保存记录到文件（支持CSV/JSON格式）
#
# 数据流（两条独立的数据流）：
#
#   [数据流1: 轨迹记录]
#   RTK GPS设备
#     ↓ [串口/网络]
#   [rtk_driver] ──→ [定位数据 WGS84]
#     ↓
#   [position_recorder] ──→ [Web界面记录]
#     ↓
#   保存到文件 (data/records/)
#
#   [数据流2: 车辆遥控]
#   Web遥控界面 (键盘/虚拟手柄)
#     ↓
#   [web_teleop] ──→ [速度命令]
#     ↓
#   [pwm_driver] ──→ [电机PWM信号]
#
# 启动前准备：
#   1. 连接RTK GPS设备（串口或网络）
#   2. 确保PWM硬件已正确配置（香橙派5 Ultra）
#   3. 根据实际情况修改配置参数
#   4. 运行场景: python3 -m runtime.main examples/manual_trajectory_recording.yaml
#
# Web界面：
#   - 遥控界面: http://localhost:9873 (键盘WASD或虚拟手柄控制车辆)
#   - 记录界面: http://localhost:8082 (记录轨迹点)
#
# 使用流程：
#   1. 打开遥控界面，使用键盘或手柄控制车辆移动
#   2. 打开记录界面，点击"开始记录"
#   3. 驾驶车辆沿目标路径行驶
#   4. 手动模式：在关键点位点击"添加点"
#   5. 自动模式：勾选"自动记录"，系统按间隔自动记录
#   6. 完成后点击"停止记录"保存轨迹
#   7. 记录文件保存在 node-hub/position_recorder/data/records/

graph_id: manual_trajectory_recording
graph_version: 1.0
node_hub_path: ./node-hub

# ═══════════════════════════════════════════════════════════════════════════
# 节点定义
# ═══════════════════════════════════════════════════════════════════════════

nodes:
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ RTK驱动节点 - 高精度GPS定位数据采集                                   │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: rtk_driver
    package: rtk_driver
    description: "从RTK GPS设备读取高精度定位数据"
    params:
      # ========== 连接方式选择 ==========
      use_network: false              # false=串口连接, true=网络连接

      # ========== 串口连接参数 ==========
      serial_port: /dev/ttyUSB0       # RTK设备串口（Linux/Mac）
                                       # Windows示例: COM3
      serial_baudrate: 115200          # 波特率（常见：9600, 115200, 230400）
      serial_timeout: 1.0              # 读取超时（秒）

      # ========== 网络连接参数 ==========
      network_host: 192.168.1.100     # RTK设备IP地址
      network_port: 5000               # RTK设备端口
      network_protocol: tcp            # 协议类型（tcp/udp）

      # ========== NMEA消息配置 ==========
      nmea_message: KSXT               # NMEA消息类型
                                       # KSXT: 司南导航（含位置+航向）
                                       # GPGGA: 标准GPS定位
                                       # GPRMC: 推荐最小GPS数据

      # ========== 输出参数 ==========
      output_frequency: 20             # 输出频率（Hz）1-20Hz可选

      # ========== RTK质量要求 ==========
      min_rtk_quality: 4               # 最小RTK质量要求
                                       # 0=无效, 1=单点, 2=浮点解, 4=固定解
                                       # 建议使用4（固定解）保证精度
      min_satellites: 10               # 最小卫星数要求

      # ========== 数据平滑（可选）==========
      enable_smoothing: false          # 是否启用平滑滤波
      smoothing_alpha: 0.3             # 平滑系数（0-1）数值越小越平滑

      # ========== 调试选项 ==========
      enable_raw_log: false            # 是否记录原始NMEA数据
      raw_log_path: /tmp/rtk_raw.log   # 原始数据日志路径

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 位置记录节点 - 提供Web界面进行轨迹记录                                │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: position_recorder
    package: position_recorder
    description: "提供Web界面进行手动/自动位置记录"
    params:
      # ========== Web服务器配置 ==========
      web_port: 8082                   # Web界面端口
                                       # 访问地址: http://localhost:8082

      # ========== 自动记录参数 ==========
      auto_record_interval: 1.0        # 自动记录间隔（秒）
                                       # 启用自动记录模式时，每隔此时间记录一个点
                                       # 建议值：
                                       # - 慢速行走：1.0秒
                                       # - 车辆行驶：0.5秒
                                       # - 高速采集：0.2秒

      # ========== 文件管理 ==========
      max_records: 10                  # 最大保留记录数
                                       # 超过此数量会自动删除最旧的记录
      record_format: csv               # 记录文件格式
                                       # csv: CSV格式（易于Excel打开）
                                       # json: JSON格式（包含更多元数据）

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ Web遥控节点 - 提供Web界面进行远程控制                                 │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: web_teleop
    package: web_teleop
    description: "提供Web界面进行车辆远程控制（键盘/虚拟手柄）"
    params:
      # ========== Web服务器配置 ==========
      http_host: 0.0.0.0               # HTTP服务器地址（0.0.0.0允许局域网访问）
      http_port: 9873                  # HTTP服务器端口
                                       # 访问地址: http://localhost:9873

      # ========== 速度限制 ==========
      max_linear_speed: 1.0            # 最大线速度（m/s）
                                       # 建议值：
                                       # - 室内测试：0.5 m/s
                                       # - 正常行驶：1.0 m/s
                                       # - 高速场景：2.0 m/s
      max_angular_speed: 1.0           # 最大角速度（rad/s）
                                       # 建议值：
                                       # - 缓慢转向：0.5 rad/s
                                       # - 正常转向：1.0 rad/s
                                       # - 快速转向：2.0 rad/s

      # ========== 输出控制 ==========
      continuous_output: true          # 是否持续输出速度命令
      output_rate: 10.0                # 输出频率（Hz）

      # ========== 安全参数 ==========
      command_timeout: 5.0             # 命令超时时间（秒）
                                       # 超过此时间未收到新命令则自动停止
      require_stop_on_disconnect: false # 断开连接时是否强制停止

      # ========== 透传模式 ==========
      passthrough_mode: false          # 是否启用透传模式
                                       # false: 手动控制模式
                                       # true: 透传自动控制命令

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ PWM驱动节点 - 输出电机PWM控制信号                                     │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: pwm_driver
    package: pwm_driver
    description: "将速度命令转换为电机PWM信号（香橙派5 Ultra）"
    params:
      # ========== PWM硬件配置 ==========
      pwm_frequency: 50.0              # PWM频率（Hz）RC标准50Hz
      left_pwmchip: pwmchip0           # 左轮PWM芯片
      left_pwm_channel: 0              # 左轮PWM通道
      right_pwmchip: pwmchip1          # 右轮PWM芯片
      right_pwm_channel: 0             # 右轮PWM通道

      # ========== RC PWM脉宽参数 ==========
      pwm_min_ns: 1000000              # 最小脉宽（1ms = 1000000ns）
      pwm_center_ns: 1500000           # 中位脉宽（1.5ms = 1500000ns，停止）
      pwm_max_ns: 2000000              # 最大脉宽（2ms = 2000000ns）
      pwm_duty_scale: 0.8              # PWM输出缩放比例（0-1）
                                       # 用于限制最大输出，建议从0.5开始测试

      # ========== 车辆参数 ==========
      wheel_base: 0.5                  # 轮距（米）
                                       # 根据实际车辆测量
      max_linear_speed: 1.0            # 最大线速度（m/s）
      max_angular_speed: 1.0           # 最大角速度（rad/s）

      # ========== 安全参数 ==========
      enable_safety_check: true        # 启用安全检查（速度限幅）
      emergency_stop: false            # 紧急停止标志
      command_timeout: 0.5             # 命令超时时间（秒）
                                       # 超时后自动停止电机

      # ========== 调试参数 ==========
      enable_verbose_log: false        # 启用详细日志
      dry_run_mode: false              # 干运行模式（不输出PWM，仅测试）
                                       # 初次测试时建议设为true

# ═══════════════════════════════════════════════════════════════════════════
# 数据连接（边）
# ═══════════════════════════════════════════════════════════════════════════

edges:
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 数据流1：轨迹记录                                                    │
  # └─────────────────────────────────────────────────────────────────────┘

  # RTK定位数据 → 位置记录器
  - from: rtk_driver.rtk_fix
    to: position_recorder.rtk_fix
    description: "高精度RTK定位数据（WGS84坐标，包含经纬度、航向、质量等信息）"

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 数据流2：车辆遥控                                                    │
  # └─────────────────────────────────────────────────────────────────────┘

  # Web遥控速度命令 → PWM驱动
  - from: web_teleop.velocity_cmd
    to: pwm_driver.velocity_cmd
    description: "速度命令（linear_velocity, angular_velocity）"

# ═══════════════════════════════════════════════════════════════════════════
# 数据格式说明
# ═══════════════════════════════════════════════════════════════════════════

# rtk_fix 端口数据格式（sensor.rtk）:
# {
#   "timestamp": 1234567890.123,      # Unix时间戳
#   "lat": 39.12345678,                # 纬度（度）
#   "lon": 116.12345678,               # 经度（度）
#   "alt": 45.6,                       # 海拔高度（米）
#   "heading": 1.57,                   # 航向角（弧度，0=东，逆时针）
#   "rtk_status": "FIXED",             # RTK状态字符串
#   "rtk_quality": 4,                  # RTK质量代码
#   "num_satellites": 15,              # 卫星数量
#   "ground_speed": 1.2,               # 地速（m/s）可选
#   "hdop": 0.8                        # 水平精度因子，可选
# }

# velocity_cmd 端口数据格式（control.velocity）:
# {
#   "linear_velocity": 1.0,            # 线速度（m/s）正=前进，负=后退
#   "angular_velocity": 0.5,           # 角速度（rad/s）正=左转，负=右转
#   "timestamp": 1234567890.123        # Unix时间戳
# }

# ═══════════════════════════════════════════════════════════════════════════
# Web界面使用说明
# ═══════════════════════════════════════════════════════════════════════════

# 界面功能：
#   1. 状态显示区：
#      - 当前RTK状态（FIXED/FLOAT/SINGLE/INVALID）
#      - 当前位置（经纬度）
#      - 卫星数量
#      - 航向角
#
#   2. 记录控制：
#      - "开始记录"：开始一次新的轨迹记录
#      - "停止记录"：结束记录并保存到文件
#      - "添加点"：手动添加当前位置点
#      - "清除"：清除当前记录的所有点
#
#   3. 自动记录模式：
#      - 勾选"自动记录"启用自动模式
#      - 系统会按设定间隔自动添加位置点
#      - 适合记录连续移动轨迹
#
#   4. 记录信息显示：
#      - 当前记录点数
#      - 记录时长
#      - 最近记录的点信息

# ═══════════════════════════════════════════════════════════════════════════
# 记录文件格式
# ═══════════════════════════════════════════════════════════════════════════

# CSV格式示例 (record_0001.csv):
# index,timestamp,lat,lon,alt,heading,rtk_status,num_satellites,record_type
# 1,1234567890.123,39.12345678,116.12345678,45.6,1.57,FIXED,15,manual
# 2,1234567891.123,39.12345679,116.12345679,45.7,1.58,FIXED,15,auto
# ...

# JSON格式示例 (record_0001.json):
# {
#   "metadata": {
#     "name": "Record 0001",
#     "created_at": 1234567890.123,
#     "auto_record_interval": 1.0
#   },
#   "points": [
#     {
#       "index": 1,
#       "timestamp": 1234567890.123,
#       "lat": 39.12345678,
#       "lon": 116.12345678,
#       "alt": 45.6,
#       "heading": 1.57,
#       "rtk_status": "FIXED",
#       "num_satellites": 15,
#       "record_type": "manual"
#     },
#     ...
#   ]
# }

# ═══════════════════════════════════════════════════════════════════════════
# 常见RTK设备配置示例
# ═══════════════════════════════════════════════════════════════════════════

# 1. 司南导航 M300/M600:
#    serial_port: /dev/ttyUSB0
#    serial_baudrate: 115200
#    nmea_message: KSXT

# 2. 千寻位置 RTK:
#    serial_port: /dev/ttyUSB0
#    serial_baudrate: 115200
#    nmea_message: GPGGA

# 3. 中海达 RTK:
#    serial_port: /dev/ttyUSB0
#    serial_baudrate: 115200
#    nmea_message: GPGGA

# 4. 网络RTK（NTRIP）:
#    use_network: true
#    network_host: 192.168.1.100
#    network_port: 5000
#    network_protocol: tcp
#    nmea_message: GPGGA

# ═══════════════════════════════════════════════════════════════════════════
# 故障排查
# ═══════════════════════════════════════════════════════════════════════════

# 问题1: RTK设备连接失败
# 解决：
#   - 检查串口设备路径是否正确（ls /dev/tty*）
#   - 检查串口权限（sudo chmod 666 /dev/ttyUSB0）
#   - 检查波特率是否匹配
#   - 启用原始日志查看数据（enable_raw_log: true）

# 问题2: RTK状态一直是FLOAT或SINGLE
# 解决：
#   - 检查RTK基站连接是否正常
#   - 检查天空视野是否开阔（避免遮挡）
#   - 等待卫星数量足够（建议>10颗）
#   - 暂时降低质量要求（min_rtk_quality: 2）测试

# 问题3: Web界面无法访问
# 解决：
#   - 检查端口是否被占用（lsof -i :8082）
#   - 尝试更换端口（web_port: 8083）
#   - 检查防火墙设置

# 问题4: 记录点数过多占用空间
# 解决：
#   - 减少max_records数量
#   - 增大auto_record_interval间隔
#   - 手动清理 node-hub/position_recorder/data/records/ 目录

# 问题5: PWM驱动初始化失败
# 解决：
#   - 检查PWM设备路径是否存在（ls /sys/class/pwm/）
#   - 检查权限（需要root或添加到gpio组）
#   - 先使用dry_run_mode: true测试逻辑
#   - 检查设备树配置是否正确

# 问题6: 车辆不响应遥控命令
# 解决：
#   - 确认Web遥控界面能正常打开
#   - 检查pwm_driver日志是否收到速度命令
#   - 确认PWM脉宽参数与电调匹配
#   - 降低pwm_duty_scale从0.5开始测试
#   - 检查电调是否已正确校准

# ═══════════════════════════════════════════════════════════════════════════
# Web遥控界面使用说明
# ═══════════════════════════════════════════════════════════════════════════

# 键盘控制：
#   W / ↑    : 前进
#   S / ↓    : 后退
#   A / ←    : 左转
#   D / →    : 右转
#   空格      : 紧急停止
#
# 虚拟手柄：
#   左摇杆Y轴 : 前进/后退
#   右摇杆X轴 : 左转/右转
#
# 界面功能：
#   - 实时显示当前速度命令
#   - 显示速度限制滑块（可调节最大速度）
#   - 紧急停止按钮

# ═══════════════════════════════════════════════════════════════════════════
# PWM电调校准说明
# ═══════════════════════════════════════════════════════════════════════════

# 大多数RC电调需要校准脉宽范围：
#   1. 断开电机电源
#   2. 启动节点，输出最大油门脉宽（2ms）
#   3. 接通电机电源，等待电调确认音
#   4. 输出最小油门脉宽（1ms）
#   5. 等待电调确认音，校准完成
#
# 标准RC PWM信号：
#   - 频率：50Hz（周期20ms）
#   - 中位：1.5ms（停止）
#   - 前进：1.5ms ~ 2.0ms
#   - 后退：1.5ms ~ 1.0ms
