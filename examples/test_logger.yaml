graph_id: test_logger
graph_version: 1
node_hub_path: ./node-hub

restart_policy:
  max_retries: 3
  backoff_ms: 1000

nodes:
  # 目标点生成器 - 模拟数据源
  - id: target_gen_0
    package: simulation/target_generator
    params:
      update_distance_threshold: 10.0
      target_distance: 50.0

  # RTK GPS 节点 - 模拟 GPS 数据源
  - id: rtk_0
    package: rtk

  # 日志记录器 - 接收两个输入
  - id: logger_0
    package: logger
    params:
      web_port: 8001
      buffer_size: 500
      enable_file_log: true
      log_file_path: "./logs/test_logger.jsonl"

edges:
  # RTK GPS 输出 → target_gen 输入
  - from: rtk_0.gps_fix
    to: target_gen_0.gps_fix

  # Target Generator 输出 → Logger 输入1
  - from: target_gen_0.target_point
    to: logger_0.input1

  # RTK GPS 输出 → Logger 输入2（同一个数据源连接到多个输入）
  - from: rtk_0.gps_fix
    to: logger_0.input2
