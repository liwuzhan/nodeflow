# Test Scenario 1: Single Node Output Test
# 目标: 验证单个Mock节点能否正确启动和输出数据
#
# 验证方法:
# - 运行时日志中确认节点启动
# - 检查输出socket文件是否创建
# - 确认节点持续运行不崩溃（运行20秒）

graph_id: test_single_mock
graph_version: 1
node_hub_path: ./node-hub

nodes:
  - id: gps_0
    package: mock_gps
    params:
      mode: stationary
      update_rate_hz: 10
      start_latitude: 39.9042
      start_longitude: 116.4074
      accuracy_meters: 0.05

edges: []

restart_policy:
  max_retries: 3
  retry_delay_sec: 5
