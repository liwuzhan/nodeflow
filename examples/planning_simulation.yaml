# NodeFlow 规划闭环仿真场景
#
# 这个示例演示完整的农田覆盖规划和控制流程：
#
# 仿真器 (外部服务，localhost:5555)
#   ↓ [地块 + 车辆信息]
# [sim_output] ──→ [global_coverage] ──→ [规划路径]
#   ↓ [RTK定位]           ↓
#   └──────────────→ [velocity_controller] ──→ [速度指令]
#                         ↓
#                      [sim_input] ──→ 仿真器 ──→ 更新位置
#                         ↑___________________|
#
# 启动前准备：
#   1. 启动仿真器: python3 simulator/server.py
#   2. 运行场景: python3 -m runtime.main examples/planning_simulation.yaml

graph_id: planning_simulation
graph_version: 1.0
node_hub_path: ./node-hub

# ═══════════════════════════════════════════════════════════════════════════
# 节点定义
# ═══════════════════════════════════════════════════════════════════════════

nodes:
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 仿真器输出 (传感器 + 地块)                                           │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: sim_output
    package: sim_output
    description: "从仿真器读取传感器数据和地块信息"
    params:
      simulator_host: localhost
      simulator_port: 5555
      timeout: 2000

      # 传感器开关
      enable_gps: false          # 禁用普通GPS
      enable_imu: false          # 禁用IMU（不需要）
      enable_rtk: true           # 启用高精度RTK GPS ✅
      enable_odometry: false     # 禁用里程计
      enable_state: false        # 禁用状态调试

      # 输出频率
      output_frequency: 50.0     # 50Hz 输出频率

      # 车辆配置（用于规划）
      implement_width_m: 3.0     # 作业幅宽 3 米
      overlap_ratio: 0.1         # 行间重叠 10%
      path_inset_m: 1.0          # 内缩距离 1 米
      pivot_turn: true           # 支持原地转向
      yaw_rate_max_deg_s: 60.0   # 最大偏航率
      min_turn_radius_m: 2.0     # 最小转弯半径

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 全局路径规划 (基于往复式扫描)                                         │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: global_coverage
    package: global_coverage
    description: "根据地块和车辆配置生成全覆盖路径"
    params: {}

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 纯追踪速度控制器                                                     │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: rtk_filter
    package: rtk_filter
    description: "RTK滤波/融合"
    params:
      alpha_pos: 0.2
      alpha_heading: 0.3
      use_imu_yaw_rate: false
  - id: waypoint_selector
    package: waypoint_selector
    description: "选择前瞻点"
    params:
      lookahead_distance_m: 2.0
      goal_tolerance_m: 0.3
  - id: track_controller
    package: track_controller
    description: "履带控制，支持原地转向"
    params:
      max_speed: 1.0
      min_speed: 0.0             # 允许速度降到0，以便精确停止
      heading_p_gain: 2.0
      max_angular_velocity: 1.0
      pivot_threshold_deg: 20.0  # 增大原地转向阈值，避免频繁切换
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 静止判定触发停机                                                    │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: idle_detector
    package: idle_detector
    description: "当RTK在60秒内移动小于1米时触发停机事件"
    params:
      window_secs: 60.0
      idle_radius_m: 1.0
      sample_rate_hz: 5.0
      debounce_secs: 5.0
  - id: shutdown_manager
    package: shutdown_manager
    description: "转发停机事件到控制缓冲，触发Runtime优雅关停"
    params:
      debounce_secs: 5.0

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 仿真器输入 (接收控制命令)                                            │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: sim_input
    package: sim_input
    description: "将控制命令发送到仿真器"
    params:
      simulator_host: localhost
      simulator_port: 5555
      timeout: 2000

      # 默认控制值（无输入时停止）
      default_linear_velocity: 0.0
      default_angular_velocity: 0.0

      # 控制模式
      control_mode: velocity     # 优先使用速度控制

      # 输入频率
      input_frequency: 50.0      # 50Hz 检查输入

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 轨迹可视化 (对比规划路径和实际轨迹)                                  │
  # └─────────────────────────────────────────────────────────────────────┘
  - id: trajectory_viz
    package: trajectory_viz
    description: "生成轨迹对比可视化图像"
    params:
      output_dir: "/Users/wuzhanli/Desktop/node/logs/jpg"
      image_format: "jpg"        # JPG 格式
      timeout: 0.0               # 不自动退出
      update_interval: 10.0      # 每10秒更新一次
      dpi: 150                   # 图像质量
      figsize_width: 14.0        # 图像宽度
      figsize_height: 12.0       # 图像高度

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 日志记录 (用于实时监测和复盘) - 暂时禁用以测试核心流程               │
  # └─────────────────────────────────────────────────────────────────────┘
  # - id: logger
  #   package: logger
  #   description: "记录关键数据并提供Web实时展示"
  #   params:
  #     web_port: 8001          # Web界面端口
  #     buffer_size: 1000       # 内存缓冲区大小
  #     enable_file_log: true   # 启用文件日志
  #     log_file_path: ./logs/planning_simulation.jsonl

# ═══════════════════════════════════════════════════════════════════════════
# 数据连接 (边)
# ═══════════════════════════════════════════════════════════════════════════

edges:
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 规划流程
  # └─────────────────────────────────────────────────────────────────────┘

  # 地块 + 车辆配置 → 规划器
  - from: sim_output.task_request
    to: global_coverage.task_request
    description: "地块和车辆配置"

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 控制流程
  # └─────────────────────────────────────────────────────────────────────┘

  # RTK定位 → 速度控制器
  - from: sim_output.rtk_fix
    to: rtk_filter.rtk_fix
    description: "原始RTK"

  # 规划路径 → 速度控制器
  - from: global_coverage.global_path
    to: waypoint_selector.global_path
    description: "规划生成的路径点序列"
  - from: rtk_filter.filtered_rtk
    to: waypoint_selector.filtered_rtk
    description: "滤波后的RTK"
  - from: waypoint_selector.next_point
    to: track_controller.next_point
    description: "前瞻点"
  - from: rtk_filter.filtered_rtk
    to: track_controller.filtered_rtk
    description: "滤波后的RTK"
  # 静止判定链路
  - from: sim_output.rtk_fix
    to: idle_detector.rtk_fix
    description: "RTK定位供静止判定使用"
  - from: idle_detector.idle_event
    to: shutdown_manager.idle_event
    description: "静止事件传递到停机管理"

  # 速度指令 → 仿真器输入
  # 这个边确保sim_input依赖velocity_controller，sim_input会在velocity_controller之后启动
  - from: track_controller.velocity_cmd
    to: sim_input.velocity_cmd
    description: "线速度和角速度"

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 可视化数据流 (轨迹对比)
  # └─────────────────────────────────────────────────────────────────────┘

  # 地块信息 → 可视化
  - from: sim_output.task_request
    to: trajectory_viz.task_request
    description: "地块边界信息"

  # 规划路径 → 可视化
  - from: global_coverage.global_path
    to: trajectory_viz.global_path
    description: "规划的全局路径"

  # RTK定位 → 可视化
  - from: sim_output.rtk_fix
    to: trajectory_viz.rtk_fix
    description: "实际轨迹（RTK GPS）"

  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ 监测和日志 (关键数据流) - 暂时禁用
  # └─────────────────────────────────────────────────────────────────────┘

  # RTK定位数据 → logger (实时位置监测)
  # 这个边也确保logger依赖sim_output，使logger在sim_output之后启动
  # - from: sim_output.rtk_fix
  #   to: logger.input1
  #   description: "RTK GPS定位数据（lat, lon, heading, rtk_status）"

  # 规划路径 → logger (路径调试)
  # - from: global_coverage.global_path
  #   to: logger.input2
  #   description: "全局规划路径（路径点序列）"

  # 速度指令 → logger (控制分析)
  # - from: velocity_controller.velocity_cmd
  #   to: logger.input3
  #   description: "速度控制指令（linear_velocity, angular_velocity）"

# ═══════════════════════════════════════════════════════════════════════════
# 配置说明
# ═══════════════════════════════════════════════════════════════════════════

# 仿真流程：
#
# 1. 初始化:
#    - sim_output 连接到仿真器，读取地块（只读一次）
#    - 组装 task_request（地块 + 车辆参数）
#
# 2. 规划:
#    - global_coverage 接收 task_request
#    - 执行往复式扫描算法，生成全覆盖路径
#    - 输出 WGS84 格式的路径点 [(lon, lat), ...]
#
# 3. 控制循环:
#    - sim_output 持续读取 RTK GPS 数据（50Hz）
#    - velocity_controller 接收 RTK 定位 + 规划路径
#    - 计算前瞻点，输出线速度 + 角速度
#    - sim_input 将速度命令发送到仿真器（50Hz）
#    - 仿真器更新机器人位置（100Hz 内部）
#    - 闭环回到 sim_output 的 RTK 输出
#
# 4. 日志:
#    - logger 节点接收 RTK、路径、控制数据
#    - 用于实时监测或离线分析

# ═══════════════════════════════════════════════════════════════════════════
# 性能指标
# ═══════════════════════════════════════════════════════════════════════════

# 通信频率:
#   - RTK 输出: 50 Hz
#   - 速度控制: 20 Hz
#   - sim_input: 50 Hz
#   - 仿真器内部: 100 Hz
#   - 总体网络延迟: ~20ms 以下

# 内存占用:
#   - sim_output: 持有 field_data + task_request （<10MB）
#   - global_coverage: 路径 ~100KB (1000点)
#   - velocity_controller: 控制状态 (<1MB)
#   - 总计: <20MB

# ═══════════════════════════════════════════════════════════════════════════
# 调试模式
# ═══════════════════════════════════════════════════════════════════════════

# 如果想添加更多调试信息，可以：
#
# 1. 启用 sim_output 的状态输出:
#    enable_state: true  → 可以看到仿真器内部状态
#
# 2. 启用更多传感器:
#    enable_imu: true    → IMU 数据（调试使用）
#    enable_odometry: true → 里程计数据
#
# 3. 增加日志端口:
#    - 在 logger 中添加更多 input 端口
#    - 连接其他节点的输出
