graph_id: test_logger_simple
graph_version: 1
node_hub_path: ./node-hub

restart_policy:
  max_retries: 3
  backoff_ms: 1000

nodes:
  # RTK GPS 节点 - 模拟 GPS 数据源
  - id: rtk_0
    package: rtk
    params:
      device: "/dev/ttyUSB0"
      baudrate: 115200
      update_rate_hz: 5.0
      simulation_mode: true

  # 控制器节点 - 生成控制命令
  - id: controller_0
    package: controller
    params:
      vehicle_type: "tracked"
      max_speed: 2.0
      target_heading: 90.0
      enable_control: true

  # 日志记录器 - 接收两个输入
  - id: logger_0
    package: logger
    params:
      web_port: 8001
      buffer_size: 500
      enable_file_log: true
      log_file_path: "./logs/test_logger.jsonl"

edges:
  # RTK → Controller
  - from: rtk_0.gps_fix
    to: controller_0.gps_fix

  # RTK → Logger 输入1
  - from: rtk_0.gps_fix
    to: logger_0.input1

  # Controller → Logger 输入2
  - from: controller_0.control_cmd
    to: logger_0.input2
