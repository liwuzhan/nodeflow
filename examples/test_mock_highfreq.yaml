# Test Scenario 5: High-Frequency Data Flow Stress Test
# 目标: 验证框架在高数据流速率下的稳定性
#
# 验证方法:
# - 接收100Hz的IMU数据无丢失
# - 系统CPU占用在合理范围
# - 无socket缓冲区溢出

graph_id: test_mock_highfreq
graph_version: 1
node_hub_path: ./node-hub

nodes:
  - id: imu_0
    package: mock_imu
    params:
      mode: stationary
      update_rate_hz: 100
      noise_level: 0.01

  - id: monitor_0
    package: mock_throughput_monitor
    params:
      window_size: 100
      log_stats_interval_sec: 5

edges:
  - from: imu_0.imu_data
    to: monitor_0.data_in

restart_policy:
  max_retries: 3
  retry_delay_sec: 5
