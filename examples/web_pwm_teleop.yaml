# NodeFlow Web遥控 + PWM驱动
#
# 最简遥控场景：通过Web界面控制电机
#
# 数据流：
#   Web遥控界面 (键盘/虚拟手柄)
#     ↓ [velocity_cmd]
#   [web_teleop] ──→ [pwm_driver]
#     ↑ [pwm_status]          ↓
#     └───── 状态反馈 ─────────┘
#
# 启动:
#   python3 -m edge.runtime.main configs/graphs/web_pwm_teleop.yaml
#
# Web界面:
#   http://localhost:9873
#   键盘 W/S 前进后退, A/D 左右转, 空格 停止

graph_id: web_pwm_teleop
graph_version: 1.0
node_hub_path: ./edge/nodes

nodes:
  - id: web_teleop
    package: observability/web_teleop
    description: "Web遥控界面"
    params:
      http_host: 0.0.0.0
      http_port: 9873
      max_linear_speed: 1.0
      max_angular_speed: 4.0
      continuous_output: true
      output_rate: 10.0
      command_timeout: 1.0          # 前端按住时 200ms 心跳；断线 1s 停车

  - id: pwm_driver
    package: io/pwm_driver
    description: "PWM电机驱动"
    params:
      # PWM硬件
      pwm_frequency: 50.0
      left_pwmchip: pwmchip0
      left_pwm_channel: 0
      right_pwmchip: pwmchip4
      right_pwm_channel: 0

      # RC脉宽
      pwm_min_ns: 1000000
      pwm_center_ns: 1500000
      pwm_max_ns: 2000000
      pwm_duty_scale: 1.0

      # 车辆参数
      wheel_base: 0.5
      max_linear_speed: 1.0
      max_angular_speed: 4.0           # 2 × max_linear / wheel_base，确保纯转向可拉满PWM

      # 安全
      enable_safety_check: true
      emergency_stop: false
      command_timeout: 0.5

      # 调试 - 默认 dry_run，确认网页与链路正常后再切 false
      enable_verbose_log: false
      dry_run_mode: true                # 默认不输出PWM；现场确认链路后改 false

# ═══════════════════════════════════════════════════════════════════════════
# 资源安全绑定（节点异常退出契约）：pwm_driver 崩溃/被 SIGKILL 时由 runtime 回中位。
# 当前 dry_run: true —— 只在死亡记录中写 planned，不触碰 sysfs。
# 台架确认极性/周期后启用真实写入：本处 dry_run: false，并在
# edge/nodes/io/pwm_driver/node.yaml 填写 failure_policy.deadline_ms。
# （正常停止路径由 SDK 的 SIGTERM 优雅退出负责回中，不依赖本绑定。）
# ═══════════════════════════════════════════════════════════════════════════
safety_resources:
  drive_pwm:
    owner: pwm_driver
    handler: linux_sysfs_pwm_pair
    dry_run: true
    params_from_owner:
      frequency_hz: pwm_frequency
      neutral_high_pulse_ns: pwm_center_ns
      left_chip: left_pwmchip
      left_channel: left_pwm_channel
      right_chip: right_pwmchip
      right_channel: right_pwm_channel
      inverted_mapping: pwm_inverted_polarity
      dry_run: dry_run_mode


edges:
  # Web遥控 → PWM驱动
  - from: web_teleop.velocity_cmd
    to: pwm_driver.velocity_cmd
    description: "速度命令（线速度 + 角速度）"
