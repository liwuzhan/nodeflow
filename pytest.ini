[pytest]
testpaths =
    tests/unit
    tests/integration
    tests/smoke
    cloud/server/tests
    edge/nodes
norecursedirs =
    old
    legacy
    mcp
    simulation
    docs
    tools/editor
    tools/cli
    scripts
    configs
    contracts
    dist
    node_modules
addopts = --import-mode=importlib
markers =
    preflight: local process/network smoke test run before hardware deployment
