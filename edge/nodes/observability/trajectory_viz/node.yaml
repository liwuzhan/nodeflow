name: trajectory_viz
version: "2.2.0"
description: "轨迹与三维作业观察节点：共用仿真真值、定位估计和实车反馈显示"

entrypoints:
  linux:
    kind: python
    cmd: ["python3", "run.py"]
  darwin:
    kind: python
    cmd: ["python3", "run.py"]
  windows:
    kind: python
    cmd: ["python", "run.py"]

ports:
  inputs:
    - name: task_enu
      type: planning.task_enu
      description: "规划任务请求（ENU坐标），包含地块边界和GPS参考点"
    - name: global_path
      type: planning.path
      description: "规划器输出的全局路径（ENU坐标）"
    - name: operation_plan
      type: planning.operation_plan
      description: "可选：带段语义的作业计划，用于路径和覆盖复盘"
    - name: pose_enu
      type: localization.pose_enu
      description: "ENU坐标系姿态，用于记录实际轨迹 (x, y, theta)"
    - name: state_info
      type: json
      description: "可选：仿真器真值，用于显示和评价；未接入时显示定位估计，不伪造真值"
    - name: raw_rtk
      type: sensor.rtk
      description: "可选：原始RTK输出，观察接口保留定位质量、双天线航向有效性和数据年龄"
    - name: next_point
      type: planning.waypoint
      description: "可选：前瞻点和路径跟踪状态，用于复盘目标点选择"
    - name: velocity_cmd
      type: control.velocity
      description: "可选：底盘速度指令，用于复盘限速、掉头减速和控制状态"
    - name: tillage_cmd
      type: implement.tillage_cmd
      description: "可选：旋耕机具控制指令，用于旧版指令复盘；三维实际机具姿态只使用反馈或仿真真值"
    - name: tillage_status
      type: implement.tillage_status
      description: "可选：机具控制器逻辑状态，三维界面标为控制器估计；ready经反馈验证也不代表高度实测"
    - name: implement_state
      type: implement.state
      description: "可选：机具实际状态反馈（hitch_height、pto_on、pto_rpm），显示优先于控制器逻辑状态"
    - name: path_progress
      type: planning.path_progress
      description: "可选：路径进度状态，用于显示段语义、横向误差和到段尾距离"
  outputs:
    - name: web_url
      type: json
      description: "Web 可视化界面的 URL 和统计信息"

params:
  web_host:
    type: string
    default: "127.0.0.1"
    description: "Web 服务器监听地址（127.0.0.1 仅本机，0.0.0.0 所有网络）"

  web_port:
    type: integer
    default: 8080
    description: "Web 服务器端口号（建议使用 >1024 的端口避免权限问题）"

  timeout:
    type: float
    default: 300.0
    description: "节点运行超时时间 (秒)"

  update_interval:
    type: float
    default: 5.0
    description: "日志打印间隔（秒），不控制姿态与场景推送频率"

  frame_interval_s:
    type: float
    default: 0.1
    description: "姿态与状态刷新间隔（秒），断流后继续更新年龄并冻结最后有效姿态"

  scene_interval_s:
    type: float
    default: 1.0
    description: "地块、路径和覆盖图刷新间隔（秒），不按每帧重新计算覆盖"

  stale_after_s:
    type: float
    default: 1.0
    description: "本地收到最后有效数据后，超过此秒数显示陈旧；仅影响观察界面"

  max_replay_samples:
    type: integer
    default: 3000
    description: "内存中保留的复盘采样点数量"

  replay_sample_interval:
    type: float
    default: 0.2
    description: "复盘采样间隔 (秒)，用于限制高频 pose 数据量"

  implement_length_m:
    type: float
    default: 0.2
    description: "评价用机具前后长度（米），简化为刚性矩形"

  implement_offset_m:
    type: float
    default: 0.0
    description: "评价用机具中心纵向偏置（米），车前为正、车后为负"
