<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位置记录工具 - NodeFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="header">
        <h1>📍 位置记录工具</h1>
        <div class="status">
            <span id="connection-status">⏳ 连接中...</span>
            <span id="recording-indicator" class="recording-badge idle">● 未记录</span>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <!-- RTK 数据显示 -->
            <div class="section">
                <div class="section-title">📡 当前位置</div>
                <div class="info-box">
                    <div class="info-row">
                        <span class="info-label">状态:</span>
                        <span class="info-value" id="rtk-status">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">纬度:</span>
                        <span class="info-value" id="rtk-lat">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">经度:</span>
                        <span class="info-value" id="rtk-lon">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">海拔:</span>
                        <span class="info-value" id="rtk-alt">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">航向:</span>
                        <span class="info-value" id="rtk-heading">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">卫星数:</span>
                        <span class="info-value" id="rtk-sats">--</span>
                    </div>
                </div>
            </div>

            <!-- 记录控制 -->
            <div class="section">
                <div class="section-title">⏺️ 记录控制</div>
                <div class="btn-group" style="margin-bottom: 10px;">
                    <button id="btn-start" class="btn-success" onclick="startRecording()">▶ 开始记录</button>
                    <button id="btn-stop" class="btn-danger" onclick="stopRecording()" disabled>⏹ 停止记录</button>
                </div>
                <div class="btn-group" style="margin-bottom: 10px;">
                    <button id="btn-add-point" class="btn-primary" onclick="addPoint()" disabled>➕ 添加当前点</button>
                    <button id="btn-clear" class="btn-secondary" onclick="clearPoints()">🗑️ 清空点</button>
                </div>
            </div>

            <!-- 自动记录 -->
            <div class="section">
                <div class="section-title">🔄 自动记录</div>
                <div class="form-row" style="align-items: center;">
                    <label class="switch">
                        <input type="checkbox" id="auto-record-toggle" onchange="toggleAutoRecord()">
                        <span class="slider"></span>
                    </label>
                    <span id="auto-record-status" style="margin-left: 10px;">已禁用</span>
                </div>
                <div class="info-text" style="margin-top: 10px;">
                    自动记录间隔: 1.0 秒
                </div>
            </div>

            <!-- 记录统计 -->
            <div class="section">
                <div class="section-title">📊 记录统计</div>
                <div class="info-box">
                    <div class="info-row">
                        <span class="info-label">点数:</span>
                        <span class="info-value" id="point-count">0</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">时长:</span>
                        <span class="info-value" id="elapsed-time">0s</span>
                    </div>
                </div>
            </div>

            <!-- 已保存的记录 -->
            <div class="section">
                <div class="section-title">💾 已保存的记录</div>
                <button class="btn-secondary" onclick="refreshRecords()" style="width:100%;margin-bottom:10px;">🔄 刷新</button>
                <ul class="record-list" id="record-list">
                    <li class="empty">加载中...</li>
                </ul>
            </div>
        </div>

        <div class="main-content">
            <!-- 点列表表格 -->
            <div class="section">
                <div class="section-title">📋 记录点列表</div>
                <div class="table-container">
                    <table id="points-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>时间</th>
                                <th>纬度</th>
                                <th>经度</th>
                                <th>海拔</th>
                                <th>航向</th>
                                <th>来源</th>
                            </tr>
                        </thead>
                        <tbody id="points-tbody">
                            <tr class="empty-row">
                                <td colspan="7" style="text-align:center;color:#999;">暂无记录点</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
